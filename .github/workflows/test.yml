name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        actor:
          - reliability-toolkit-mcp
          - portfolio-health-monitor

    name: ${{ matrix.actor }}
    defaults:
      run:
        working-directory: actors/${{ matrix.actor }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: actors/${{ matrix.actor }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test